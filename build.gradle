plugins {
    // Java 8 ile çalışan Loom sürümü (1.16.x dönemi). Gradle 6.9.4 ile birlikte kullanılır.
    id 'fabric-loom' version '0.8-SNAPSHOT'
    id 'maven-publish'
}

// Minecraft 1.16.5 Java 8 ile çalışır; derleme de Java 8 ile yapılabilir.
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    // Fabric / Mojang depoları Loom tarafından otomatik eklenir.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
}
